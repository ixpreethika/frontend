<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokemon Lovers</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* ---------- TOOLTIP ---------- */
    .tooltip {
      position: absolute;
      backdrop-filter: blur(12px);
      background: rgba(255, 255, 255, .9);
      padding: 10px;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .25);
      pointer-events: none;
      z-index: 999;
      animation: fadeScale .18s ease;
    }

    /* ---------- CINEMATIC BALL ---------- */
    .cineBall {
      position: fixed;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(red 50%, white 50%);
      border: 5px solid black;
      z-index: 9999;
    }

    .cineBall:after {
      content: "";
      width: 20px;
      height: 20px;
      background: white;
      border: 4px solid black;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* throw */
    .throwAnim {
      animation: throwAnim .6s ease forwards;
    }

    @keyframes throwAnim {
      0% {
        transform: translate(-50%, -50%) scale(.4)
      }

      70% {
        transform: translate(-50%, 180px) scale(1)
      }

      100% {
        transform: translate(-50%, 170px)
      }
    }

    /* shake */
    .shakeAnim {
      animation: shake .5s ease;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translate(-50%, 170px) rotate(0)
      }

      25% {
        transform: translate(-48%, 170px) rotate(8deg)
      }

      50% {
        transform: translate(-52%, 170px) rotate(-8deg)
      }

      75% {
        transform: translate(-49%, 170px) rotate(5deg)
      }
    }

    /* open */
    .openTop {
      animation: openTop .45s forwards;
    }

    .openBottom {
      animation: openBottom .45s forwards;
    }

    @keyframes openTop {
      to {
        transform: translate(-50%, 120px) rotate(-25deg);
        opacity: 0
      }
    }

    @keyframes openBottom {
      to {
        transform: translate(-50%, 220px) rotate(25deg);
        opacity: 0
      }
    }

    /* flash */
    .flash {
      position: fixed;
      inset: 0;
      background: white;
      z-index: 9998;
      animation: flash .3s ease forwards;
    }

    @keyframes flash {
      from {
        opacity: .9
      }

      to {
        opacity: 0
      }
    }

    /* modal fade */
    @keyframes fadeScale {
      from {
        opacity: 0;
        transform: scale(.85)
      }

      to {
        opacity: 1;
        transform: scale(1)
      }
    }

    .modal {
      animation: fadeScale .25s ease
    }
  </style>
</head>

<body class="bg-gradient-to-br from-yellow-100 to-red-100 min-h-screen">

  <!-- HEADER -->
  <header class="bg-white shadow-md p-4 sticky top-0 z-50">

    <div class="max-w-6xl mx-auto flex flex-col md:flex-row gap-3 items-center justify-between">

      <h1 class="text-3xl font-bold text-red-500">Pokemon Lovers</h1>

      <div class="flex gap-2 w-full md:w-auto relative">

        <input id="searchInput"
          class="border border-gray-300 p-2 rounded w-full md:w-64 focus:ring-2 focus:ring-red-400 outline-none"
          placeholder="Search Pokémon...">

        <button id="searchBtn" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded transition">
          Search
        </button>

        <button id="randomBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded transition">
          Random
        </button>

        <button id="compareBtn" class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded transition">
          Compare
        </button>

        <select id="sortSelect" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded shadow">
          <option value="">Sort</option>
          <option value="name">Name</option>
          <option value="hp">HP</option>
          <option value="attack">Attack</option>
        </select>

        <!-- suggestions -->
        <div id="suggestions" class="absolute top-full left-0 right-0 bg-white shadow rounded hidden z-50"></div>

      </div>
    </div>
  </header>

  <!-- RESULT AREA -->
  <div id="resultArea" class="max-w-4xl mx-auto mt-6 text-center"></div>

  <!-- GALLERY -->
  <section class="max-w-6xl mx-auto mt-12 px-4">

    <h2 class="text-2xl font-bold mb-6 text-center">All Pokemons</h2>

    <div id="pokemonGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>

  </section>

  <script src="script.js"></script>

</body>

</html>
